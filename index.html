<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f4" />
    <title>Skilloop Zone</title>
    <meta name="description" content="Skilloop Zone - 交换所长，学会新的可能。" />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #f5f7f4;
        color: #172a27;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main { width: min(100%, 640px); }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        margin-bottom: 40px;
        background: #d8f06a;
        color: #172a27;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(40px, 8vw, 76px);
        line-height: 1.05;
        font-weight: 750;
      }

      p {
        margin: 0;
        font-size: clamp(17px, 3vw, 22px);
        line-height: 1.7;
      }

      .status {
        margin-top: 48px;
        padding-top: 20px;
        border-top: 1px solid #bdcbc6;
        color: #53645f;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>Skilloop Zone</h1>
      <p>交换所长，学会新的可能。</p>
      <p class="status">技能互换平台 · 正在搭建中</p>
    </main>
  </body>
</html>
